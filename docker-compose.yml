services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: flamelenses
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: flamelenses
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: